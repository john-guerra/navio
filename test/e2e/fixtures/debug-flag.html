<!doctype html>
<meta charset="utf-8" />
<div id="nv"></div>
<script>
  // Set before navio loads, the way you would from a devtools console + reload
  // or an Observable cell that runs ahead of the require.
  if (new URLSearchParams(location.search).get("global") === "1") {
    window.NAVIO_DEBUG = true;
  }
</script>
<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  if (new URLSearchParams(location.search).get("static") === "1") {
    navio.DEBUG = true;
  }
  var data = d3.range(20).map(function (i) {
    return { id: i + 1, category: ["a", "b"][i % 2], value: i };
  });
  window.nv = new navio(d3.select("#nv"), 300);
  window.nv.id("id");
  window.nv.data(data);
  window.nv.addAllAttribs();
</script>
