<!doctype html>
<meta charset="utf-8" />
<title>Attributes added as accessor functions</title>
<div id="nv"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  // A function attribute is how you draw the SAME field in more than one
  // column - the column takes its name from the function. Navio supports it;
  // getAttribs() hands the functions back, while the screen shows their names.
  const CATS = ["alpha", "beta", "gamma", "delta"];
  const rows = d3.range(40).map((i) => ({
    id: i,
    // Deliberately NOT in category order, so a working sort has to move rows.
    cat: CATS[(i * 7) % 4],
    score: (i * 13) % 50,
  }));

  const asA = (d) => d.cat;
  Object.defineProperty(asA, "name", { value: "palette A" });
  const asB = (d) => d.cat;
  Object.defineProperty(asB, "name", { value: "palette B" });

  window.nv = new navio(d3.select("#nv"), { height: 300, settings: false });
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addCategoricalAttrib(
    asA,
    d3.scaleOrdinal(d3.schemeCategory10).domain(CATS)
  );
  window.nv.addCategoricalAttrib(
    asB,
    d3.scaleOrdinal(d3.schemeAccent).domain(CATS)
  );
  window.nv.addSequentialAttrib("score");
  // Re-setting the data is what rebuilds the scales and draws.
  window.nv.data(rows);

  window.cats = () => window.nv.getRowsAtLevel(0).map((d) => d.cat);
  // How many contiguous blocks of one category the column is in. Equal to the
  // number of distinct categories exactly when the column is grouped, and
  // larger whenever it is interleaved - which is what sorting has to fix.
  window.runs = () =>
    window.cats().filter((c, i, a) => i === 0 || c !== a[i - 1]).length;
</script>
