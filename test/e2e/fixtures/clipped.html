<!doctype html>
<meta charset="utf-8" />
<title>Navio inside a scrolling container</title>
<style>
  body {
    font:
      14px system-ui,
      sans-serif;
    margin: 0;
    padding: 16px;
  }
  /* The case an anchored panel cannot escape: an ancestor that clips. Nothing
     absolutely positioned inside can get out of this box, at any z-index. */
  #clip {
    overflow: hidden;
    height: 240px;
    width: 420px;
    border: 2px solid #c33;
    background: #fafafa;
  }
</style>
<div id="clip"><div id="nv"></div></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  const CATS = ["alpha", "beta", "gamma"];
  const rows = d3.range(60).map((i) => ({
    id: i + 1,
    category: CATS[i % 3],
    value: (i * 37) % 100,
    score: (i * 13) % 50,
  }));

  const params = new URLSearchParams(location.search);
  window.nv = new navio(d3.select("#nv"), {
    height: 180,
    settingsPlacement: params.get("placement") || "below",
  });
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addAllAttribs();
</script>
