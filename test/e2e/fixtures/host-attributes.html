<!doctype html>
<meta charset="utf-8" />
<title>Navio in a container the page styles itself</title>
<style>
  /* The page's own styling, attached to the page's own class. If Navio
     replaces the class attribute this stops applying, which looks like a
     broken stylesheet rather than a widget overwriting an attribute. */
  .card {
    border: 3px solid rgb(0, 128, 0);
    padding: 8px;
  }
</style>

<div id="nv" class="card featured" data-keep="yes"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  const rows = d3.range(40).map((i) => ({
    id: i + 1,
    category: ["alpha", "beta", "gamma"][i % 3],
    value: (i * 37) % 100,
  }));

  window.nv = new navio(d3.select("#nv"), 200);
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addAllAttribs();
</script>
