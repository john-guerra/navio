<!doctype html>
<meta charset="utf-8" />
<style>
  /* Mimics an Observable notebook cell: a positioned ancestor around the
     widget, inside a long scrolling document. */
  .cell {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
  }
  #spacer {
    height: 0;
  }
</style>

<div id="spacer"></div>
<div class="cell" id="cell">
  <div id="nv"></div>
</div>
<div style="height: 1500px"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  var params = new URLSearchParams(location.search);
  if (params.get("spacer")) {
    document.getElementById("spacer").style.height =
      params.get("spacer") + "px";
  }
  if (params.get("positioned") === "0") {
    document.getElementById("cell").style.position = "static";
  }

  var data = d3.range(60).map(function (i) {
    return {
      id: i + 1,
      category: ["a", "b", "c"][i % 3],
      value: (i * 37) % 100,
    };
  });

  window.nv = new navio(d3.select("#nv"), 400);
  window.nv.id("id");
  window.nv.data(data);
  window.nv.addAllAttribs();
</script>
