<!doctype html>
<meta charset="utf-8" />
<title>Navio in a host container that clips</title>
<style>
  body {
    font:
      14px system-ui,
      sans-serif;
    margin: 0;
    padding: 16px;
  }
  /* The reported case: the HOST page makes the very container Navio was given
     a scroll box. Navio never sets this itself - #100 blamed Navio for it -
     but the settings panel is a child of this element, so it is clipped to a
     210px-tall sliver all the same. */
  #nv {
    overflow: auto;
  }
  /* ?inline=1 takes that rule away and puts the clip on the element itself, as
     an inline `overflow-x` longhand - the shape a dashboard writes when it only
     means to let a wide widget scroll sideways. A stylesheet rule cannot tell
     you whether the lift was written correctly: clearing the inline shorthand
     re-exposes the sheet either way, so the host looks unharmed. An inline
     longhand does tell you, because the shorthand overwrites it. */
  #nv.inline-overflow {
    overflow: visible;
  }
  /* A SECOND clipping box, further up than the container Navio was given, so
     the fix has to walk the whole ancestor chain rather than only checking the
     panel's own parent. Transformed as well, which is what rules out solving
     this with `position: fixed`: a transformed ancestor becomes the containing
     block for fixed descendants and clips them again. */
  #outer.transformed {
    transform: translateZ(0);
    overflow: auto;
    height: 260px;
  }
</style>

<div id="outer"><div id="nv"></div></div>
<p id="below">Content immediately below, as a notebook cell would be.</p>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  const params = new URLSearchParams(location.search);
  if (params.get("transform") === "1") {
    document.getElementById("outer").classList.add("transformed");
  }
  if (params.get("inline") === "1") {
    const el = document.getElementById("nv");
    el.classList.add("inline-overflow");
    // Set BEFORE Navio is constructed, the way a host page's own styling
    // arrives. overflow-x alone is what a page writes when it means "let this
    // scroll sideways"; CSS computes overflow-y to auto anyway, so the panel
    // is clipped just the same.
    el.style.overflowX = "auto";
  }

  // Enough attributes that the settings list is far taller than the widget.
  const rows = d3.range(60).map((i) => ({
    id: i + 1,
    category: ["alpha", "beta", "gamma"][i % 3],
    value: (i * 37) % 100,
    score: (i * 13) % 50,
    grade: ["A", "B", "C", "D"][i % 4],
    region: ["north", "south", "east", "west"][i % 4],
    cohort: (i * 11) % 9,
  }));

  window.nv = new navio(d3.select("#nv"), {
    height: 210,
    settingsPlacement: params.get("placement") || "below",
  });
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addAllAttribs();
</script>
