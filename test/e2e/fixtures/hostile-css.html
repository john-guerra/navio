<!doctype html>
<meta charset="utf-8" />
<title>Host page styles</title>
<style>
  body {
    margin: 0;
    padding: 12px;
  }
  /* An ORDINARY host page rule. Navio ships no stylesheet and styles its own
     chrome inline, so anything it leaves unset is the host's to decide - and a
     margin on every button is exactly what a page that has buttons of its own
     writes. ?hostile=0 leaves it out, so the two can be compared. */
  body.styled button {
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    margin: 0 6px 12px 0;
    border-radius: 5px;
  }
  body.styled select {
    padding: 8px;
    margin: 4px;
  }
  body.styled input {
    margin: 7px;
  }
</style>
<div id="nv"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  if (new URLSearchParams(location.search).get("hostile") !== "0")
    document.body.classList.add("styled");

  const rows = d3.range(40).map((i) => ({
    id: i,
    cat: "c" + (i % 4),
    value: (i * 13) % 50,
    other: (i * 7) % 30,
  }));

  window.nv = new navio(d3.select("#nv"), { height: 200 });
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addAllAttribs();

  /** Vertical pitch of the attribute rows in the settings panel. */
  window.rowPitch = () => {
    const rows = [...document.querySelectorAll("#nv ._nv_settings select")]
      .map((s) => s.closest("div,label"))
      .filter((el) => el && el.querySelector('input[type="checkbox"]'));
    if (rows.length < 2) return null;
    const a = rows[0].getBoundingClientRect(),
      b = rows[1].getBoundingClientRect();
    return Math.round(b.top - a.top);
  };
</script>
