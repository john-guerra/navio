<!doctype html>
<meta charset="utf-8" />
<title>Navio theme</title>
<style>
  /* Deliberately NOT setting a background: the widget must sit on whatever the
     page provides, which is the point of staying transparent. */
  body {
    margin: 0;
    padding: 12px;
  }
  /* ?page=dark paints the page dark WITHOUT declaring color-scheme, the way a
     hand-rolled dark site does. ?scheme=1 declares it, the way a page that
     opts into the reader's preference does. ?box=dark puts the widget in a
     dark panel on an otherwise light page. */
  body.page-dark {
    background: #14161a;
    color: #e9eaee;
  }
  body.page-light {
    background: #ffffff;
    color: #111111;
  }
  html.declared {
    color-scheme: light dark;
  }
  #box.dark {
    background: #14161a;
    padding: 10px;
  }
  #box.light {
    background: #ffffff;
    padding: 10px;
  }
</style>
<div id="box"><div id="nv"></div></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  const params = new URLSearchParams(location.search);
  if (params.get("page"))
    document.body.classList.add("page-" + params.get("page"));
  if (params.get("scheme") === "1")
    document.documentElement.classList.add("declared");
  if (params.get("box"))
    document.getElementById("box").classList.add(params.get("box"));
  const CATS = ["alpha", "beta", "gamma", "delta"];
  const rows = d3.range(60).map((i) => ({
    id: i,
    cat: CATS[i % 4],
    // Some nulls, so the null colour is actually drawn.
    value: i % 7 === 0 ? null : (i * 13) % 50,
  }));

  const options = { height: 300 };
  if (params.get("theme")) options.theme = params.get("theme");
  if (params.get("divisions")) options.divisionsColor = params.get("divisions");
  if (params.get("null")) options.nullColor = params.get("null");

  window.nv = new navio(d3.select("#nv"), options);
  window.nv.id("id");
  window.nv.data(rows);
  window.nv.addAllAttribs();

  /** What a reader actually sees: the computed fill of the column headers. */
  window.headerFill = () => {
    const t = document.querySelector("#nv svg .attribOverlay text");
    return t ? getComputedStyle(t).fill : null;
  };
  window.panelColours = () => {
    const p = document.querySelector("#nv ._nv_settings");
    if (!p) return null;
    const cs = getComputedStyle(p);
    return { background: cs.backgroundColor, color: cs.color };
  };
  /** The container must not paint a ground of its own. */
  window.containerBackground = () =>
    getComputedStyle(document.querySelector("#nv")).backgroundColor;
  window.resolved = () => window.nv.resolvedTheme();
</script>
