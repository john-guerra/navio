<!doctype html>
<meta charset="utf-8" />
<!--
  Constructs Navio from a STRING selector rather than a d3 selection.

  init() supports both - it calls d3.select() on the argument when it is a
  string, and again when it has no .selectAll - but every other fixture in this
  suite passes d3.select("#nv"), so the string path had no coverage at all. It
  is the path the modules extracted for #67 are most exposed to: `selection` is
  REBOUND by that conversion, after the module factories have been constructed.
-->
<div id="nv"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global navio */
  var data = [
    { id: 1, category: "a", value: 10 },
    { id: 2, category: "b", value: 20 },
    { id: 3, category: "a", value: 30 },
    { id: 4, category: "c", value: 15 },
    { id: 5, category: "b", value: 25 },
  ];

  window.nv = new navio("#nv", 400);
  window.nv.id("id");
  window.nv.data(data);
  window.nv.addAllAttribs();
</script>
