<!doctype html>
<meta charset="utf-8" />
<div id="host"></div>
<div id="host2"></div>

<script src="/node_modules/d3/dist/d3.js"></script>
<script src="/node_modules/popper.js/dist/umd/popper.js"></script>
<script src="/dist/navio.js"></script>
<script>
  /* global d3, navio */
  window.rows = [
    { id: 1, category: "a", value: 10 },
    { id: 2, category: "b", value: 20 },
    { id: 3, category: "a", value: 30 },
    { id: 4, category: "c", value: 15 },
    { id: 5, category: "b", value: 25 },
  ];

  // The UMD bundle attaches the named exports alongside the default.
  const { NavioWidget } = navio;

  window.w1 = NavioWidget(window.rows, { height: 400, id: "id" });
  document.getElementById("host").appendChild(window.w1);

  window.w2 = NavioWidget(window.rows, { height: 400, id: "id" });
  document.getElementById("host2").appendChild(window.w2);

  window.inputEvents = 0;
  window.w1.addEventListener("input", () => window.inputEvents++);

  /**
   * Minimal stand-in for Observable's Inputs.bind, using only the reactive
   * widget contract: copy source.value into target on the source's `input`.
   * Assignment (not setValue) so the target repaints without re-dispatching.
   */
  window.bind = function (target, source) {
    target.value = source.value;
    source.addEventListener("input", () => {
      target.value = source.value;
    });
  };

  window.selectedOf = (w) =>
    w
      .getSelected()
      .map((d) => d.id)
      .sort()
      .join(" ");
</script>
